  <!-- Modal de Confirmación Logout -->
  <div class="modal fade" id="modalLogout" tabindex="-1" aria-labelledby="modalLogoutLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title" id="modalLogoutLabel">
            <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <i class="fas fa-question-circle text-warning" style="font-size: 3rem; margin-bottom: 1rem;"></i>
          <h6>¿Está seguro que desea cerrar sesión?</h6>
          <p class="text-muted mb-0">Será redirigido a la página principal del sistema.</p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancelar
          </button>
          <button type="button" class="btn btn-warning" id="confirmarLogout">
            <i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Éxito General -->
  <div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="modalExitoLabel">
            <i class="fas fa-check-circle me-2"></i>Operación Exitosa
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <i class="fas fa-check-circle text-success" style="font-size: 3rem; margin-bottom: 1rem;"></i>
          <h6 id="mensajeExito">¡Plato guardado exitosamente!</h6>
          <p class="text-muted mb-0">La operación se completó correctamente.</p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-success" id="btnVolverGestionExito">
            <i class="fas fa-utensils me-1"></i>Volver a Gestión de Platos
          </button>
        </div>
      </div>
    </div>
  </div>
