<!-- Estilo para que el contenido aparezca debajo del banner -->
<style>
    #principal {
        padding-top: 120px !important; /* Espacio para el banner fijo */
    }
    .container {
        margin-top: 20px !important;
    }
</style>

<div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center font-weight-light my-2">
                            <i class="fas fa-plus-circle me-2"></i>Crear Nuevo Plato
                        </h3>
                    </div>
                    <div class="card-body">
                        <form id="formCrearProducto" onsubmit="return false;">  
                            <!-- Nombre del producto -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="nombreProducto" type="text" placeholder="Nombre del plato" required>
                                <label for="nombreProducto">Nombre del Plato</label>
                            </div>

                            <!-- Precio -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="precioProducto" type="number" step="0.01" min="0" placeholder="Precio" required>
                                <label for="precioProducto">Precio ($)</label>
                            </div>

                            <!-- Cantidad -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="cantidadProducto" type="number" min="1" placeholder="Cantidad" required>
                                <label for="cantidadProducto">Cantidad en Stock</label>
                            </div>

                            <!-- Descripción -->
                            <div class="form-floating mb-3">
                                <textarea class="form-control" id="descripcionProducto" placeholder="Descripción del plato" style="height: 100px"></textarea>
                                <label for="descripcionProducto">Descripción (Opcional)</label>
                            </div>

                            <!-- Sección de Foto -->
                            <div class="mb-3">
                                <label class="form-label">Foto del Plato</label>
                                <div class="d-flex gap-2 mb-3">
                                    <button type="button" class="btn btn-outline-primary" id="btnActivarCamara">
                                        <i class="fas fa-camera me-2"></i>Activar Cámara
                                    </button>
                                    <button type="button" class="btn btn-outline-success" id="btn_capturar" style="display: none;">
                                        <i class="fas fa-camera-retro me-2"></i>Capturar Foto
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="btnSubirArchivo">
                                        <i class="fas fa-upload me-2"></i>Subir Archivo
                                    </button>
                                </div>
                                
                                <!-- Input para archivo (oculto) -->
                                <input type="file" id="inputArchivoFoto" accept="image/*" style="display: none;">
                                
                                <!-- Video para la cámara -->
                                <video id="my_camara" width="300" height="200" autoplay style="display: none;" class="border rounded mb-3"></video>
                                
                                <!-- Canvas para la foto capturada -->
                                <canvas id="foto" width="300" height="200" style="display: none;" class="border rounded mb-3"></canvas>
                                
                                <!-- Previsualización de archivo subido -->
                                <div id="previsualizacionArchivo" class="text-center" style="display: none;">
                                    <img id="imagenArchivo" src="" alt="Archivo subido" class="img-fluid border rounded" style="max-width: 300px; max-height: 200px;">
                                </div>
                                
                                <!-- Botones de control de foto -->
                                <div id="controlesFoto" style="display: none;">
                                    <button type="button" id="btnEliminarFoto" class="btn btn-outline-danger btn-sm">
                                        <i class="fas fa-trash me-1"></i>Eliminar Foto
                                    </button>
                                    <button type="button" id="btnNuevaFoto" class="btn btn-outline-info btn-sm">
                                        <i class="fas fa-redo me-1"></i>Tomar Nueva Foto
                                    </button>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between">
                                <button type="button" class="btn btn-secondary" onclick="cargarPaginasAdmin('gestionProductos')">
                                    <i class="fas fa-arrow-left me-2"></i>Cancelar
                                </button>
                                <button type="button" class="btn btn-primary" id="btnGuardarProducto" onclick="window.guardarProductoSimple()">
                                    <i class="fas fa-save me-2"></i>Guardar Plato
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
    </div>
</div>

<!-- Modal de éxito -->
<div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalExitoLabel">
                    <i class="fas fa-check-circle me-2"></i>¡Éxito!
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">                    <p id="modalExitoMensaje">El plato ha sido creado exitosamente.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="volverAGestion()">Aceptar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de foto capturada -->
<div class="modal fade" id="modalFotoCapturada" tabindex="-1" aria-labelledby="modalFotoCapturadaLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalFotoCapturadaLabel">
                    <i class="fas fa-camera me-2"></i>¡Foto Capturada!
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>La foto ha sido capturada exitosamente.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
            </div>
        </div>
    </div>
</div>

<script>
// Cargar scripts necesarios cuando se carga esta página
if (!window.productosSimpleLoaded) {
    const script = document.createElement('script');
    script.src = './public/js/productos_simple.js';
    document.head.appendChild(script);
    window.productosSimpleLoaded = true;
}
</script>
