<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba - Crear Producto</title>
    <link href="../public/bootstrap-5.3.5-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    
    <!-- Scripts necesarios para funcionalidad completa -->
    <script src="../public/js/productos_simple.js"></script>
    <script src="../public/js/fotoProductos.js"></script>
    <script src="../public/js/loadAdmin.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h3 class="text-center">🧪 Prueba - Crear Producto</h3>
                    </div>
                    <div class="card-body">
                        
                        <!-- Botones de prueba -->
                        <div class="mb-3">
                            <button class="btn btn-info btn-sm" onclick="debugSimple()">🔍 Debug</button>
                            <button class="btn btn-warning btn-sm" onclick="probarFormulario()">📝 Llenar Formulario</button>
                            <button class="btn btn-danger btn-sm" onclick="limpiarTodoSimple()">🗑️ Limpiar Todo</button>
                        </div>
                        
                        <!-- Botones de test de cámara -->
                        <div class="mb-3 p-2 bg-light rounded">
                            <h6>🧪 Tests de Cámara:</h6>
                            <button class="btn btn-primary btn-sm" onclick="testCamara()">📹 Test Cámara</button>
                            <button class="btn btn-success btn-sm" onclick="testCaptura()">📸 Test Captura</button>
                            <button class="btn btn-info btn-sm" onclick="testCompleto()">🎬 Test Completo</button>
                            <button class="btn btn-secondary btn-sm" onclick="testArchivo()">📁 Test Archivo</button>
                        </div>
                        
                        <form id="formCrearProducto" onsubmit="return false;">
                            <!-- Nombre del producto -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="nombreProducto" type="text" placeholder="Nombre del producto" required>
                                <label for="nombreProducto">Nombre del Producto</label>
                            </div>

                            <!-- Precio -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="precioProducto" type="number" step="0.01" min="0" placeholder="Precio" required>
                                <label for="precioProducto">Precio ($)</label>
                            </div>

                            <!-- Cantidad -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="cantidadProducto" type="number" min="1" placeholder="Cantidad" required>
                                <label for="cantidadProducto">Cantidad en Stock</label>
                            </div>

                            <!-- Descripción -->
                            <div class="form-floating mb-3">
                                <textarea class="form-control" id="descripcionProducto" placeholder="Descripción del producto" style="height: 100px"></textarea>
                                <label for="descripcionProducto">Descripción (Opcional)</label>
                            </div>

                            <!-- Sección de Foto -->
                            <div class="mb-3">
                                <label class="form-label">Foto del Producto</label>
                                <div class="d-flex gap-2 mb-3">
                                    <button type="button" class="btn btn-outline-primary" id="btnActivarCamara">
                                        <i class="fas fa-camera me-2"></i>Activar Cámara
                                    </button>
                                    <button type="button" class="btn btn-outline-success" id="btn_capturar" style="display: none;">
                                        <i class="fas fa-camera-retro me-2"></i>Capturar Foto
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="btnSubirArchivo">
                                        <i class="fas fa-upload me-2"></i>Subir Archivo
                                    </button>
                                </div>
                                
                                <!-- Input para archivo (oculto) -->
                                <input type="file" id="inputArchivoFoto" accept="image/*" style="display: none;">
                                
                                <!-- Video para la cámara -->
                                <video id="my_camara" width="300" height="200" autoplay style="display: none;" class="border rounded mb-3"></video>
                                
                                <!-- Canvas para la foto capturada -->
                                <canvas id="foto" width="300" height="200" style="display: none;" class="border rounded mb-3"></canvas>
                                
                                <!-- Previsualización de archivo subido -->
                                <div id="previsualizacionArchivo" class="text-center" style="display: none;">
                                    <img id="imagenArchivo" src="" alt="Archivo subido" class="img-fluid border rounded" style="max-width: 300px; max-height: 200px;">
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between">
                                <button type="button" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Cancelar
                                </button>
                                <button type="button" class="btn btn-primary" id="btnGuardarProducto" onclick="window.guardarProductoSimple()">
                                    <i class="fas fa-save me-2"></i>Guardar Producto
                                </button>
                            </div>
                        </form>
                        
                        <!-- Log de estado -->
                        <div class="mt-4">
                            <h5>📊 Estado del Sistema</h5>
                            <div id="logEstado" class="bg-light p-3 border rounded">
                                <p><strong>Productos en localStorage:</strong> <span id="contadorProductos">0</span></p>
                                <p><strong>Foto actual:</strong> <span id="estadoFoto">No hay foto</span></p>
                                <p><strong>Último evento:</strong> <span id="ultimoEvento">Página cargada</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../public/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/productos_simple.js"></script>
    
    <script>
        // Función para actualizar el estado en pantalla
        function actualizarEstado(evento) {
            document.getElementById('ultimoEvento').textContent = evento;
            
            // Contar productos
            const productos = JSON.parse(localStorage.getItem('productos') || '[]');
            document.getElementById('contadorProductos').textContent = productos.length;
            
            // Estado de foto
            const estadoFoto = window.fotoProductoActual ? 'Foto cargada' : 'No hay foto';
            document.getElementById('estadoFoto').textContent = estadoFoto;
        }
        
        // Función para llenar formulario de prueba
        window.probarFormulario = function() {
            document.getElementById('nombreProducto').value = 'Producto Test ' + Date.now();
            document.getElementById('precioProducto').value = '15.99';
            document.getElementById('cantidadProducto').value = '10';
            document.getElementById('descripcionProducto').value = 'Producto de prueba automática';
            actualizarEstado('Formulario llenado para prueba');
        };
        
        // Sobrescribir función de debug para actualizar estado
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar que todas las funciones estén disponibles después de cargar
            setTimeout(() => {
                const funciones = [
                    'debugSimple', 'guardarProductoSimple', 'limpiarTodoSimple',
                    'testCamara', 'testCaptura', 'testCompleto', 'testArchivo'
                ];
                
                const disponibles = [];
                const faltantes = [];
                
                funciones.forEach(fn => {
                    if (typeof window[fn] === 'function') {
                        disponibles.push(fn);
                    } else {
                        faltantes.push(fn);
                    }
                });
                
                console.log('✅ Funciones disponibles:', disponibles);
                if (faltantes.length > 0) {
                    console.warn('⚠️ Funciones faltantes:', faltantes);
                }
                
                actualizarEstado(`Sistema cargado - ${disponibles.length}/${funciones.length} funciones OK`);
                
                // Actualizar debug original si está disponible
                if (typeof window.debugSimple === 'function') {
                    const debugOriginal = window.debugSimple;
                    window.debugSimple = function() {
                        debugOriginal();
                        actualizarEstado('Debug ejecutado - revisar consola');
                    };
                }
            }, 2000);
        });
        
        // Actualizar estado inicial
        setTimeout(() => {
            actualizarEstado('Sistema inicializado');
        }, 1000);
        
        // Actualizar estado cada 5 segundos
        setInterval(() => {
            const productos = JSON.parse(localStorage.getItem('productos') || '[]');
            document.getElementById('contadorProductos').textContent = productos.length;
            
            const estadoFoto = window.fotoProductoActual ? 'Foto cargada (' + Math.round(window.fotoProductoActual.length/1024) + 'KB)' : 'No hay foto';
            document.getElementById('estadoFoto').textContent = estadoFoto;
        }, 5000);
    </script>
</body>
</html>
