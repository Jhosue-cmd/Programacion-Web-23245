
    <div class="login-background">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <!-- Tarjeta de login-->
            <div class="login-card">
              <div class="card-header">
                <h3>Iniciar Sesión</h3>
                <br />
                <p class="text-dark">Ingresa tus credenciales para acceder</p>
              </div>
              <div class="card-body text-dark">
                <form id="loginForm" onsubmit="return recuperarYvalidar(event)">


                  <div class="mb-4">

                    <div class=" form-floating ">
                      <input
                        type="text"
                        class="form-control"
                        id="inputnombreUsuario"
                        placeholder="Nombre de usuario"
                        required
                      />
                                          <label
                      for="inputnombreUsuario"
                    >
                  Nombre de usuario</label>
                    </div>
                  </div>



                  <div class="mb-4">

                    <div class="form-floating">
                      <input
                        type="password"
                        class="form-control form-control-lg"
                        id="inputPassword"
                        placeholder="Contraseña"
                        required
                      />
                                          <label
                      for="inputPassword"
                    >Contraseña</label>
                    </div>
                  </div>

                  <div class="form-check mb-3 d-flex align-items-center">
                    <input
                      class="form-check-input me-2 "
                      id="inputRememberPassword"
                      type="checkbox"
                      value=""
                    />
                    <label for="inputRememberPassword"
                      >Mostrar Contraseña</label
                    >
                  </div>
                  <div
                    class="d-flex align-items-center justify-content-between mt-4 mb-0"
                  >
                    <a class="small text-decoration-none link-accent" href="#"
                      >¿Olvidaste tu contraseña?</a
                    >
                    <button type="submit" class="btn btn-dark btn-login">
                      <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                    </button>
                  </div>
                </form>
                <br /><br />
              </div>
              <div class="card-footer text-center py-3">
                <div class="small">
                  <a
                    href="#"
                    class="link-accent"
                    onclick="cargarPaginas('register')"
                    >¿Necesitas una cuenta? ¡Regístrate!</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="login-footer">
        Derechos de autor &copy; Cristian Lisintuña 2025
      </div>
    </div>
